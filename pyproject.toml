[project]
name = "pronunciationcoach"
version = "0.1.0"
description = "Phoneme-level pronunciation feedback for learners of English, built on open speech models."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "transformers>=4.45",
    "phonemizer>=3.3",
    "faster-whisper>=1.1",
    "soundfile>=0.12",
    "numpy>=1.26",
    "gradio>=5.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pronunciationcoach"]

# CPU-only PyTorch wheels on every platform. The PyPI Linux wheels drag in ~2 GB
# of CUDA libraries that a GPU-less Hugging Face Space would never use.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
