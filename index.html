<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pronunciation Coach</title>
  <meta name="description" content="Front door to the Pronunciation Coach: forwards you to the coach when it is open." />
  <style>
    :root { color-scheme: light dark; --fg: #1c2331; --muted: #667085; --accent: #4f46e5; --ok: #2e8b57; --bg: #f7f8fb; --card: #fff; }
    @media (prefers-color-scheme: dark) { :root { --fg: #e8ecf3; --muted: #9aa4b5; --bg: #0f1420; --card: #171d2b; } }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 34rem; margin: 10vh auto; padding: 0 16px; }
    .card { background: var(--card); border-radius: 1rem; padding: 1.6rem; box-shadow: 0 6px 30px rgba(0,0,0,.08); }
    h1 { margin: 0 0 .4rem; font-size: 1.6rem; }
    p { line-height: 1.5; margin: .5rem 0; }
    .muted { color: var(--muted); font-size: .95rem; }
    .btn { display: inline-block; margin-top: 1rem; padding: .9rem 1.4rem; border-radius: .8rem; background: var(--accent); color: #fff; font-weight: 700; text-decoration: none; font-size: 1.1rem; }
    .btn.secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
    .status { display: inline-block; padding: .2rem .6rem; border-radius: 999px; font-size: .85rem; font-weight: 600; }
    .open { background: #e3f4ea; color: var(--ok); } .closed { background: #fde8e6; color: #b3261e; } .unknown { background: #eef0f4; color: var(--muted); }
    .lost { background: #fff3d6; color: #8a5a00; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Pronunciation Coach</h1>
      <p id="status"><span class="status unknown">checking…</span></p>
      <p id="message" class="muted">Looking for the coach…</p>
      <p id="actions"></p>
    </div>
  </main>
  <script>
    // share.bat publishes coach.json next to this page:
    //   { "url": "...", "open": true, "opened_at": "ISO time", "seen": "ISO time" }
    // The address of the coach changes every time the teacher starts it; this page never does.
    // "seen" is re-stamped every few minutes while sharing runs, so a machine that went to
    // sleep or lost its connection (without ever publishing "closed") shows as lost, not open.
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const actions = document.getElementById('actions');
    const practise = '<a class="btn secondary" href="https://audiophrases.github.io/GAPhonetics/">Practise sounds meanwhile</a>';
    const hours = (iso) => (Date.now() - Date.parse(iso)) / 36e5;
    const minutes = (iso) => (Date.now() - Date.parse(iso)) / 6e4;
    const clock = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const LOST_AFTER_MIN = 15;

    // Can the coach's address be reached at all? A quick tunnel that Cloudflare has dropped no
    // longer resolves, and the browser would land on an error page instead of the coach.
    async function reachable(url) {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 8000);
      try { await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ctl.signal }); return true; }
      catch (e) { return false; }
      finally { clearTimeout(timer); }
    }

    // GitHub Pages caches files for 10 minutes, so ask fresher sources first: the GitHub API
    // (about a minute), then the raw file (about five), and only then the copy next to this page.
    const [owner, repo] = ['audiophrases', 'PronunciationCoach'];
    const sources = [
      async () => {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/coach.json?ref=gh-pages`, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        const data = await res.json();
        return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(data.content.replace(/\n/g, '')), c => c.charCodeAt(0))));
      },
      async () => {
        const res = await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/gh-pages/coach.json`, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        return res.json();
      },
      async () => {
        const res = await fetch(`./coach.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status);
        return res.json();
      },
    ];

    async function main() {
      let info = null;
      for (const source of sources) {
        try { info = await source(); break; } catch (e) { /* try the next one */ }
      }

      if (info && info.open && info.url) {
        const stale = info.seen ? minutes(info.seen) > LOST_AFTER_MIN : hours(info.opened_at) >= 12;
        if (!stale) {
          status.innerHTML = '<span class="status open">open</span>';
          message.textContent = `The coach was started at ${clock(info.opened_at)}. Checking the connection…`;
          actions.innerHTML = `<a class="btn" href="${info.url}">Open the coach</a> ${practise}`;
          if (await reachable(info.url)) {
            message.textContent = `The coach was started at ${clock(info.opened_at)}. Taking you there…`;
            setTimeout(() => { window.location.href = info.url; }, 1500);
            return;
          }
        }
        status.innerHTML = '<span class="status lost">connection lost</span>';
        const since = info.seen ? ` It was last heard from at ${clock(info.seen)}.` : '';
        message.textContent = `The coach's machine cannot be reached right now - it may have gone to sleep or lost its internet connection.${since} Ask your teacher to restart sharing, then reload this page.`;
        actions.innerHTML = practise;
        return;
      }
      status.innerHTML = '<span class="status closed">closed</span>';
      const last = info && info.opened_at ? ` It was last open on ${new Date(info.opened_at).toLocaleString()}.` : '';
      message.textContent = `The coach is not running right now.${last} Ask your teacher to start it, then reload this page.`;
      actions.innerHTML = practise;
    }
    main();
  </script>
</body>
</html>
